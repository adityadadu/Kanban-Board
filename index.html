<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Project Tracker</h1>
    <p>Track every project from Backlog to Completed</p>
  </header>

  <main class="board">

    <section class="column backlog">
      <h2>Backlog</h2>

      <article class="card">
        <h3>Poster for Tech Fest</h3>
        <span class="tag design">Design</span>
        <p class="notes">No notes yet.</p>
      </article>
    </section>

    <section class="column in-progress">
      <h2>In Progress</h2>

      <article class="card">
        <h3>Portfolio Website</h3>
        <span class="tag web">Web</span>
        <p class="notes">Homepage layout done, working on projects section</p>
      </article>
    </section>

    <section class="column review">
      <h2>Review</h2>

      <article class="card">
        <h3>IoT Weather Station</h3>
        <span class="tag hardware">Hardware</span>
        <p class="notes">Sensor calibration pending</p>
      </article>
    </section>

    <section class="column completed">
      <h2>Completed</h2>
    </section>

  </main>

</body>
</html>
